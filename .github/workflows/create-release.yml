on:
  milestone:
    types: [closed]

name: Create Release
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release-tag: ${{ github.event.milestone.title }}
    secrets: inherit

  create-release:
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Create Release Notes
      uses: docker://decathlon/release-notes-generator-action:2.0.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # release_file.md is owned by root (written from the docker action), so write to a new file
    - name: Add Milestone Description
      env:
        MILESTONE_DESCRIPTION: ${{ github.event.milestone.description }}
      run: printf '%s\n\n%s\n' "$MILESTONE_DESCRIPTION" "$(cat release_file.md)" > release_notes.md

    - name: Download NuGet Packages
      uses: actions/download-artifact@v8
      with:
        name: nuget
        path: nuget

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.event.milestone.title }}
        name: ${{ github.event.milestone.title }}
        target_commitish: ${{ github.sha }}
        body_path: release_notes.md
        files: nuget/**/*.nupkg
        draft: false
        prerelease: false

    # Releases created with GITHUB_TOKEN don't trigger the Build workflow's publish, so push here
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Push packages
      run: dotnet nuget push './nuget/**/*.nupkg' --skip-duplicate -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }}
