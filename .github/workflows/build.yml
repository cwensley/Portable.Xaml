name: Build

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  # called by release.yml to build a release
  workflow_call:
    inputs:
      version:
        description: Version to build every package as, e.g. 1.2.3
        type: string
        default: ''

env:
  BuildVersion: "CI.${{ github.run_id }}"
  BuildBranch: "${{ inputs.version && format('refs/tags/{0}', inputs.version) || github.ref }}"
  BuildParameters: "/v:Minimal /p:Configuration=Release Portable.Xaml.slnx"

permissions:
  contents: read

jobs:
  build:

    runs-on: windows-latest

    env:
      PlatformBuildParameters: ""

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Get strong name key
      id: get_strong_name
      uses: timheuer/base64-to-file@v2
      if: github.event_name == 'push' || inputs.version
      with:
        fileName: 'Portable.Xaml.snk'
        encodedString: ${{ secrets.STRONG_NAME_KEY }}
    
    - name: Build
      run: dotnet build ${{ env.PlatformBuildParameters }} ${{ env.BuildParameters }} "/p:AssemblyOriginatorKeyFile=${{ steps.get_strong_name.outputs.filePath }}"

    - name: Pack
      run: dotnet pack --no-build ${{ env.PlatformBuildParameters }} ${{ env.BuildParameters }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nuget
        path: artifacts/nuget/Release/*.*nupkg

    - name: Test
      run: dotnet test --no-build ${{ env.PlatformBuildParameters }} ${{ env.BuildParameters }}
